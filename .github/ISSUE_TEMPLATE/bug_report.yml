name: Bug report
description: Something in an Ink Tools plugin, app or CLI does not work as documented.
labels: ["type: bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - inkctl (Mac CLI)
        - Account Sync (account-sync)
        - Lasso Actions (lasso-actions)
        - Image Editing (image-editing)
        - Device Transfer (device-transfer)
        - Handwriting Language (app)
        - Ink Notebook Editor (Mac app)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version
      placeholder: 0.2.0-beta.3
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Supernote model and firmware
      placeholder: model, firmware version
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove any account name, token or personal text first.
      render: text
