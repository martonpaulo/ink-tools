name: Scan

# The weekly dependency audit, plus the Markdown check of the root documents on every change to them
# (#77): no subproject workflow starts for README.md, ROADMAP.md, AGENTS.md or docs/. The adapter
# boundaries are checked on every change to a package, a plugin or the checker (#101), the registry of
# internals and the files it writes on every change to them (#294), and gates.json's
# npm gates install from each lockfile when node_modules is missing (#135), and each plugin's native
# build leaves no .snplg without its app.npk (#153). No two tracked paths differ only in case, so the
# owner's Mac, whose disk ignores case, sees every file CI sees (#227). The weekly audit fails on any advisory
# audit-exceptions.json does not name (#154).
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths: ['*.md', 'docs/**', 'packages/**', 'plugins/**', 'apps/**', 'cli/**', 'design/**', 'templates/**', 'registry/**', 'scripts/**', 'scripts/boundaries.py', 'scripts/test_boundaries.py', 'gates.json', 'scripts/test_gate_install.py', 'scripts/test_cloud_config.py', '.github/cloud.json', 'scripts/test_native_package.py', 'scripts/npm_audit.py', 'scripts/test_npm_audit.py', 'audit-exceptions.json', '.github/workflows/prerelease-*.yml', 'scripts/plugin-version.cjs', '.github/workflows/scan.yml']
  pull_request:
    paths: ['*.md', 'docs/**', 'packages/**', 'plugins/**', 'apps/**', 'cli/**', 'design/**', 'templates/**', 'registry/**', 'scripts/**', 'scripts/boundaries.py', 'scripts/test_boundaries.py', 'gates.json', 'scripts/test_gate_install.py', 'scripts/test_cloud_config.py', '.github/cloud.json', 'scripts/test_native_package.py', 'scripts/npm_audit.py', 'scripts/test_npm_audit.py', 'audit-exceptions.json', '.github/workflows/prerelease-*.yml', 'scripts/plugin-version.cjs', '.github/workflows/scan.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: root documents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the Markdown (text check and issue links)
        run: |
          python3 scripts/text_check.py .
          python3 scripts/issue_links.py . --repo "$GITHUB_REPOSITORY"

      - name: Check the README Status vocabulary (#268)
        run: |
          python3 scripts/readme_status.py --root .
          python3 -B -m unittest scripts/test_readme_status.py

      - name: Check the DRY ratchet
        run: python3 scripts/dry_check.py --root .

      - name: Check that no test sleeps or bounds wall-clock time without a note
        run: python3 scripts/sleep_guard.py .

      - name: Check that no two tracked paths differ only in case (#227)
        run: |
          python3 scripts/case_check.py --root .
          python3 -B -m unittest scripts/test_case_check.py

  boundaries:
    name: adapter boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the adapter boundaries
        run: |
          python3 scripts/boundaries.py --root .
          python3 -B -m unittest scripts/test_boundaries.py

      - name: Check the registry of internals and the files written from it (#294)
        run: |
          python3 scripts/registry.py --root .
          python3 -B -m unittest scripts/test_registry.py

      - name: Check that each npm gate installs its subproject and cloud.json names every gate (#135, #301)
        run: python3 -B -m unittest scripts/test_gate_install.py scripts/test_cloud_config.py

      - name: Check each plugin's light native build (#153)
        run: python3 -B -m unittest scripts/test_native_package.py

      - name: Check the npm audit filter (#154)
        run: python3 -B -m unittest scripts/test_npm_audit.py

      - name: Check that every prerelease tag carries its plugin name (#155)
        run: node scripts/plugin-version.cjs --workflows .

      - name: Check that every plugin names an icon that exists (#248)
        run: node scripts/plugin-version.cjs --icons .

  npm-audit:
    name: npm audit ${{ matrix.dir }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [plugins/account-sync, plugins/word-lookup, plugins/device-transfer, plugins/image-editing, plugins/plugin-diagnostics, packages]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Audit production dependencies, honouring audit-exceptions.json (#154)
        run: python3 "$GITHUB_WORKSPACE/scripts/npm_audit.py" .
