name: Validate Probe

# Runs only when plugins/probe/, the sn-adapter Java it compiles (#213), or this file changes; the gate is the subproject's own `npm run validate`.
on:
  push:
    branches: [main]
    paths: ['plugins/probe/**', 'packages/sn-adapter/native/**', '.github/workflows/validate-probe.yml']
  pull_request:
    paths: ['plugins/probe/**', 'packages/sn-adapter/native/**', '.github/workflows/validate-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/probe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/probe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the subproject's Markdown (text check and issue links, #77)
        working-directory: .
        run: |
          python3 plugins/ink2pic/scripts/text_check.py plugins/probe
          python3 plugins/ink2pic/scripts/issue_links.py plugins/probe --repo "$GITHUB_REPOSITORY"

      - name: Run the gate
        run: npm run validate

      - name: Build the native-capable plugin package
        # The JS package, then the Java module (#59); native-toolchain.sh reuses the runner's SDK.
        run: npm run build

      - name: Check the package holds the native module
        run: unzip -l build/outputs/Probe.snplg | grep -q app.npk

      - name: Upload the plugin package for the owner to install on the device
        # Probe has no release (dev-only); its .snplg is fetched from this run's artifact (#59).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Probe-snplg
          path: plugins/probe/build/outputs/Probe.snplg
          if-no-files-found: error
