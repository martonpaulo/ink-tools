name: Validate Probe

# Runs only when plugins/probe/ (or this file) changes; the gate is the subproject's own `npm run validate`.
on:
  push:
    branches: [main]
    paths: ['plugins/probe/**', '.github/workflows/validate-probe.yml']
  pull_request:
    paths: ['plugins/probe/**', '.github/workflows/validate-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/probe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/probe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the gate
        run: npm run validate

      - name: Build the native-capable plugin package
        # The JS package, then the Java module (#59); native-toolchain.sh reuses the runner's SDK.
        run: npm run build

      - name: Check the package holds the native module
        run: unzip -l build/outputs/Probe.snplg | grep -q app.npk
