name: Validate Smart Pen

# Runs only when plugins/smart-pen/, the shared packages it imports (#93, #305), or this file changes; the gate is the subproject's own `npm run validate`.
on:
  push:
    branches: [main]
    paths: ['plugins/smart-pen/**', 'packages/native-build/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/picture-search/**', 'packages/ink-core/**', 'scripts/plugin-version.cjs', '.github/workflows/validate-smart-pen.yml']
  pull_request:
    paths: ['plugins/smart-pen/**', 'packages/native-build/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/picture-search/**', 'packages/ink-core/**', 'scripts/plugin-version.cjs', '.github/workflows/validate-smart-pen.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate smart-pen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/smart-pen
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/smart-pen/package-lock.json

      - name: Restore node_modules, keyed on the lockfile (#301)
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            plugins/smart-pen/node_modules
          key: node-modules-${{ runner.os }}-node24-plugins/smart-pen-${{ hashFiles('plugins/smart-pen/package-lock.json') }}

      - name: Restore the native toolchain, keyed on its script (#301)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/smart-pen/.toolchain
          key: toolchain-${{ runner.os }}-plugins/smart-pen-${{ hashFiles('plugins/smart-pen/scripts/native-toolchain.sh') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run the gate
        run: npm run validate

      - name: Build the native-capable plugin package
        # The JS package, then picture-search's Java under Smart Pen's module names (#142, #305);
        # native-toolchain.sh reuses the runner's SDK. The Mac cannot build app.npk yet (#153).
        run: npm run build

      - name: Check the package holds the native module
        run: unzip -l build/outputs/RealTimeConversion.snplg | grep -q app.npk

      - name: Upload the plugin package for the device round
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SmartPen-snplg
          path: plugins/smart-pen/build/outputs/RealTimeConversion.snplg
          if-no-files-found: error
