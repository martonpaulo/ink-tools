name: Validate Real-Time Conversion

# Runs only when plugins/real-time-conversion/, the shared packages it imports (ui-kit, sn-adapter, ink-core) or this file changes; the gate is the subproject's own `npm run validate`.
on:
  push:
    branches: [main]
    paths: ['plugins/real-time-conversion/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/ink-core/**', '.github/workflows/validate-real-time-conversion.yml']
  pull_request:
    paths: ['plugins/real-time-conversion/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/ink-core/**', '.github/workflows/validate-real-time-conversion.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate real-time-conversion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/real-time-conversion
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/real-time-conversion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the subproject's Markdown (text check and issue links, #77)
        working-directory: .
        run: |
          python3 scripts/text_check.py plugins/real-time-conversion
          python3 scripts/issue_links.py plugins/real-time-conversion --repo "$GITHUB_REPOSITORY"

      - name: Run the gate
        run: npm run validate

      - name: Build the plugin package
        run: npm run build

      - name: Upload the plugin package for the device round
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RealTimeConversion-snplg
          path: plugins/real-time-conversion/build/outputs/RealTimeConversion.snplg
          if-no-files-found: error
