name: Validate inkctl

# Runs only when cli/inkctl/ (or this file) changes; the gate is its own `make validate`.
on:
  push:
    branches: [main]
    paths: ['cli/inkctl/**', '.github/workflows/validate-inkctl.yml']
  pull_request:
    paths: ['cli/inkctl/**', '.github/workflows/validate-inkctl.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate inkctl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli/inkctl
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate
        run: make validate
