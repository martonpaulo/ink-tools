name: Validate Ink Notebook Editor

# Runs only when the app's code, build files, the registry it reads, the bug form it fills or this file
# changes, never for its Markdown alone (gates.json, #301): the NoteFormat reader's own
# `swift test` (#261), then the app's `make check`: build, lint, tests and invariants (#262).
on:
  push:
    branches: [main]
    paths: ['apps/ink-notebook-editor/NoteFormat/**', 'apps/ink-notebook-editor/Sources/**', 'apps/ink-notebook-editor/Tests/**', 'apps/ink-notebook-editor/Support/**', 'apps/ink-notebook-editor/scripts/**', 'apps/ink-notebook-editor/Package.swift', 'apps/ink-notebook-editor/Makefile', 'apps/ink-notebook-editor/.swiftlint.yml', 'apps/ink-notebook-editor/.swift-format', 'registry/**', '.github/ISSUE_TEMPLATE/**', '.github/workflows/validate-ink-notebook-editor.yml']
  pull_request:
    paths: ['apps/ink-notebook-editor/NoteFormat/**', 'apps/ink-notebook-editor/Sources/**', 'apps/ink-notebook-editor/Tests/**', 'apps/ink-notebook-editor/Support/**', 'apps/ink-notebook-editor/scripts/**', 'apps/ink-notebook-editor/Package.swift', 'apps/ink-notebook-editor/Makefile', 'apps/ink-notebook-editor/.swiftlint.yml', 'apps/ink-notebook-editor/.swift-format', 'registry/**', '.github/ISSUE_TEMPLATE/**', '.github/workflows/validate-ink-notebook-editor.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Xcode pin: the app needs the macOS 27 SDK, which only the `xcode-27` image carries (a public
# preview, https://github.com/actions/runner-images/issues/14404), as martonpaulo/leve's Validate. The
# job checks the version it got rather than a path. The SwiftLint pin is a release binary with a
# verified checksum; swift-format comes from Xcode.
env:
  XCODE_VERSION: "27.1"
  SWIFTLINT_VERSION: "0.65.1"
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0

jobs:
  validate:
    name: validate ink-notebook-editor
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ink-notebook-editor
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm the pinned Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep -qx "Xcode $XCODE_VERSION"

      - name: Install the pinned SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/swiftlint"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Report the tool versions
        run: |
          swift --version
          swiftlint version | grep -qx "$SWIFTLINT_VERSION"
          swift format --version

      - name: Test NoteFormat
        working-directory: apps/ink-notebook-editor/NoteFormat
        run: swift test

      - name: Check the app (build, lint, tests, invariants)
        run: make check
