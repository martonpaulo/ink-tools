name: Validate shared packages

# Runs only when packages/ (or this file) changes; the gate is the subproject's own `npm run validate`.
on:
  push:
    branches: [main]
    paths: ['packages/**', 'registry/**', '.github/workflows/validate-packages.yml']
  pull_request:
    paths: ['packages/**', 'registry/**', '.github/workflows/validate-packages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the subproject's Markdown (text check and issue links, #77)
        working-directory: .
        run: |
          python3 scripts/text_check.py packages
          python3 scripts/issue_links.py packages --repo "$GITHUB_REPOSITORY"

      - name: Run the gate
        run: npm run validate
