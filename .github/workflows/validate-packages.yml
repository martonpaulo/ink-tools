name: Validate shared packages

# Runs only when packages/ (or this file) changes; the gate is the subproject's own `npm run validate`.
on:
  push:
    branches: [main]
    paths: ['packages/**', 'registry/**', '.github/workflows/validate-packages.yml']
  pull_request:
    paths: ['packages/**', 'registry/**', '.github/workflows/validate-packages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Restore node_modules, keyed on the lockfile (#301)
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node24-packages-${{ hashFiles('packages/package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run the gate
        run: npm run validate
