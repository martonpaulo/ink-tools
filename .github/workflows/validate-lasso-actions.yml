name: Validate Lasso Actions

# Runs only when plugins/lasso-actions/, the shared packages/ui-kit/ it imports (#93), or this file changes; the gate is the subproject's own `npm run validate`.
on:
  push:
    branches: [main]
    paths: ['plugins/lasso-actions/**', 'packages/native-build/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/picture-search/**', 'packages/ink-core/**', '.github/workflows/validate-lasso-actions.yml']
  pull_request:
    paths: ['plugins/lasso-actions/**', 'packages/native-build/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/picture-search/**', 'packages/ink-core/**', '.github/workflows/validate-lasso-actions.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate lasso-actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/lasso-actions
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/lasso-actions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the subproject's Markdown (text check and issue links, #77)
        working-directory: .
        run: |
          python3 scripts/text_check.py plugins/lasso-actions
          python3 scripts/issue_links.py plugins/lasso-actions --repo "$GITHUB_REPOSITORY"

      - name: Run the gate
        run: npm run validate

      - name: Build the native-capable plugin package
        # The JS package, then picture-search's Java under Lookup's module names, the code name Lasso Actions keeps (#306) (#142);
        # native-toolchain.sh reuses the runner's SDK. The Mac cannot build app.npk yet (#153).
        run: npm run build

      - name: Check the package holds the native module
        run: unzip -l build/outputs/Lookup.snplg | grep -q app.npk

      - name: Upload the plugin package for the device round
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LassoActions-snplg
          path: plugins/lasso-actions/build/outputs/Lookup.snplg
          if-no-files-found: error
