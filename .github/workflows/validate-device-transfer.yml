name: Validate Device Transfer

# Runs only when plugins/device-transfer/, the shared packages/ui-kit/ and packages/sn-adapter/ it imports (#93, #98), or this file changes; the gate is the subproject's own `npm run validate`.
on:
  push:
    branches: [main]
    paths: ['plugins/device-transfer/**', 'packages/native-build/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/ink-core/**', 'scripts/plugin-version.cjs', '.github/workflows/validate-device-transfer.yml']
  pull_request:
    paths: ['plugins/device-transfer/**', 'packages/native-build/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/ink-core/**', 'scripts/plugin-version.cjs', '.github/workflows/validate-device-transfer.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate device-transfer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/device-transfer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/device-transfer/package-lock.json

      - name: Restore node_modules, keyed on the lockfile (#301)
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            plugins/device-transfer/node_modules
          key: node-modules-${{ runner.os }}-node24-plugins/device-transfer-${{ hashFiles('plugins/device-transfer/package-lock.json') }}

      - name: Restore the native toolchain, keyed on its script (#301)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/device-transfer/.toolchain
          key: toolchain-${{ runner.os }}-plugins/device-transfer-${{ hashFiles('plugins/device-transfer/scripts/native-toolchain.sh') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run the gate
        run: npm run validate

      - name: Build the native-capable plugin package
        # The JS package, then the Java module (#98); native-toolchain.sh reuses the runner's SDK.
        run: npm run build

      - name: Check the package holds the native module
        run: unzip -l build/outputs/Relay.snplg | grep -q app.npk

      - name: Upload the plugin package for the device round
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Relay-snplg
          path: plugins/device-transfer/build/outputs/Relay.snplg
          if-no-files-found: error
