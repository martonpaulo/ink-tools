name: Validate Smart Shapes

# Runs only when plugins/smart-shapes/, the shared packages it imports (ui-kit, sn-adapter, ink-core) or this file changes; the gate is the subproject's own `npm run validate`.
on:
  push:
    branches: [main]
    paths: ['plugins/smart-shapes/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/ink-core/**', 'scripts/plugin-version.cjs', '.github/workflows/validate-smart-shapes.yml']
  pull_request:
    paths: ['plugins/smart-shapes/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/ink-core/**', 'scripts/plugin-version.cjs', '.github/workflows/validate-smart-shapes.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate smart-shapes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/smart-shapes
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/smart-shapes/package-lock.json

      - name: Restore node_modules, keyed on the lockfile (#301)
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            plugins/smart-shapes/node_modules
          key: node-modules-${{ runner.os }}-node24-plugins/smart-shapes-${{ hashFiles('plugins/smart-shapes/package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run the gate
        run: npm run validate

      - name: Build the plugin package
        run: npm run build

      - name: Upload the plugin package for the device round
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SmartShapes-snplg
          path: plugins/smart-shapes/build/outputs/SmartShapes.snplg
          if-no-files-found: error
