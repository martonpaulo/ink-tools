name: Validate Ink Tools Helper

# Runs only when apps/ink-tools-helper/ (or this file, the Lingo app's toolchain it reuses, or the shared version rule) changes; the gate is the
# subproject's own JVM tests and APK build (#215).
on:
  push:
    branches: [main]
    paths: ['apps/ink-tools-helper/**', 'apps/handwriting-language/scripts/**', 'scripts/plugin-version.cjs', 'registry/**', 'packages/native-build/host-tools.cjs', 'packages/native-build/signing.cjs', 'packages/native-build/signing.test.cjs', '.github/workflows/validate-ink-tools-helper.yml']
  pull_request:
    paths: ['apps/ink-tools-helper/**', 'apps/handwriting-language/scripts/**', 'scripts/plugin-version.cjs', 'registry/**', 'packages/native-build/host-tools.cjs', 'packages/native-build/signing.cjs', 'packages/native-build/signing.test.cjs', '.github/workflows/validate-ink-tools-helper.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate ink-tools-helper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ink-tools-helper
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run the JVM tests
        run: node scripts/build.cjs --test

      - name: Build the signed APK
        # toolchain.sh reuses the runner's SDK; the debug key is made fresh for this run.
        run: node scripts/build.cjs
