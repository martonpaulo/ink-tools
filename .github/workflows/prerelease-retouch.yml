name: Prerelease Image Editing

# Each Image Editing build becomes a GitHub prerelease carrying Retouch-<version>.snplg (#203): a device
# build comes from CI, never from the owner's Mac. A push to main that changes the plugin or a package
# it uses publishes when its retouch-v<package.json version> tag does not exist yet, so each version
# publishes once; the version follows root AGENTS.md › Product versioning (#155).

on:
  push:
    branches: [main]
    paths: ['plugins/retouch/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/picture-search/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prerelease:
    name: prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: plugins/retouch
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the tag from PluginConfig.json
        id: tag
        run: |
          version="$(node ../../scripts/plugin-version.cjs .)"
          tag="retouch-v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.tag.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/retouch/package-lock.json

      - name: Install dependencies
        if: steps.tag.outputs.publish == 'true'
        run: npm ci

      - name: Run the gate
        if: steps.tag.outputs.publish == 'true'
        run: npm run validate

      - name: Build the package with its native app.npk
        if: steps.tag.outputs.publish == 'true'
        run: npm run build

      - name: Create the prerelease
        if: steps.tag.outputs.publish == 'true'
        run: |
          # The asset name carries the version so the owner can tell builds apart on the tablet.
          asset="build/outputs/Retouch-${TAG#retouch-v}.snplg"
          cp build/outputs/Retouch.snplg "$asset"
          gh release create "$TAG" "$asset" \
            --prerelease --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Image Editing prerelease build, with its native app.npk. Install on the tablet."

      - name: Read the asset back
        if: steps.tag.outputs.publish == 'true'
        run: |
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$names"
          case "$names" in
            *"Retouch-${TAG#retouch-v}.snplg"*) ;;
            *) echo "::error::Retouch-${TAG#retouch-v}.snplg is missing from $TAG."; exit 1 ;;
          esac
