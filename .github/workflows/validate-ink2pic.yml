name: Validate Ink2Pic

# Runs only when plugins/ink2pic/, the shared packages/ui-kit/ it imports (#93), or this file changes; the gate is the subproject's own `npm run validate`.
on:
  push:
    branches: [main]
    paths: ['plugins/ink2pic/**', 'packages/ui-kit/**', '.github/workflows/validate-ink2pic.yml']
  pull_request:
    paths: ['plugins/ink2pic/**', 'packages/ui-kit/**', '.github/workflows/validate-ink2pic.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate ink2pic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/ink2pic
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/ink2pic/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the gate
        run: npm run validate
