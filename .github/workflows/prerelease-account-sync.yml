name: Prerelease Account Sync

# Each Bridge build becomes a GitHub prerelease carrying Bridge.snplg (#27), so the owner can
# download it for the tablet. A cloud session cannot push a tag, so a push to main that changes
# PluginConfig.json publishes when its account-sync-v<package.json version> tag does not exist yet; the
# version follows root AGENTS.md › Product versioning (#155), checked by scripts/plugin-version.cjs.

on:
  push:
    branches: [main]
    paths: [plugins/account-sync/PluginConfig.json]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time per plugin, never cancelled half way (#301).
concurrency:
  group: prerelease-account-sync
  cancel-in-progress: false

jobs:
  prerelease:
    name: prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: plugins/account-sync
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the tag from PluginConfig.json
        id: tag
        run: |
          version="$(node ../../scripts/plugin-version.cjs .)"
          tag="account-sync-v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.tag.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/account-sync/package-lock.json

      - name: Install dependencies
        if: steps.tag.outputs.publish == 'true'
        run: npm ci

      - name: Run the gate
        if: steps.tag.outputs.publish == 'true'
        run: npm run validate

      - name: Build the plugin package
        if: steps.tag.outputs.publish == 'true'
        run: npm run build

      - name: Create the prerelease
        if: steps.tag.outputs.publish == 'true'
        run: |
          # The asset name carries the version so the owner can tell builds apart on the tablet.
          asset="build/outputs/Bridge-${TAG#account-sync-v}.snplg"
          cp build/outputs/Bridge.snplg "$asset"
          gh release create "$TAG" "$asset" \
            --prerelease --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Bridge prerelease build. Install on the tablet; Bridge appears only in plugin Settings, never in a note."

      - name: Read the asset back
        if: steps.tag.outputs.publish == 'true'
        run: |
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$names"
          case "$names" in
            *"Bridge-${TAG#account-sync-v}.snplg"*) ;;
            *) echo "::error::Bridge-${TAG#account-sync-v}.snplg is missing from $TAG."; exit 1 ;;
          esac
