name: Validate Handwriting Language

# Runs only when apps/handwriting-language/ (or this file, the shared version rule, or ui-kit's tokens, #275) changes; the gate is the
# subproject's own JVM tests and APK build (#157, #160).
on:
  push:
    branches: [main]
    paths: ['apps/handwriting-language/**', 'packages/ui-kit/src/tokens.json', 'packages/ui-kit/android-tokens*', 'scripts/plugin-version.cjs', 'registry/**', 'packages/native-build/host-tools.cjs', 'packages/native-build/signing.cjs', 'packages/native-build/signing.test.cjs', '.github/workflows/validate-handwriting-language.yml']
  pull_request:
    paths: ['apps/handwriting-language/**', 'packages/ui-kit/src/tokens.json', 'packages/ui-kit/android-tokens*', 'scripts/plugin-version.cjs', 'registry/**', 'packages/native-build/host-tools.cjs', 'packages/native-build/signing.cjs', 'packages/native-build/signing.test.cjs', '.github/workflows/validate-handwriting-language.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate handwriting-language
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/handwriting-language
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run the JVM tests
        run: node scripts/build.cjs --test

      - name: Build the signed APK
        # toolchain.sh reuses the runner's SDK; the debug key is made fresh for this run.
        run: node scripts/build.cjs
