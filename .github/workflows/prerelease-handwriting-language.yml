name: Prerelease Handwriting Language

# Each Handwriting Language build becomes a GitHub prerelease carrying its APK, so a person installs it
# on the tablet with no computer (#494). A push to main that changes app.json publishes when its
# handwriting-language-v<version> tag does not exist yet; the version follows root AGENTS.md ›
# Product versioning (#155). The APK is signed with the release key of the
# INKTOOLS_LINGO_KEYSTORE_BASE64 and INKTOOLS_LINGO_KEYSTORE_PASSWORD repository secrets, so each
# release updates the last one. Without them the workflow fails and publishes nothing: a user build
# signed by a runner key could never be updated. The secrets are read only here, never in a validate
# workflow, and this workflow never runs on a pull request.

on:
  push:
    branches: [main]
    paths: [apps/handwriting-language/app.json]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time per plugin, never cancelled half way (#301).
concurrency:
  group: prerelease-handwriting-language
  cancel-in-progress: false

jobs:
  prerelease:
    name: prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: apps/handwriting-language
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the tag from app.json
        id: tag
        run: |
          version="$(node -p 'require("./app.json").version')"
          tag="handwriting-language-v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.tag.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run the JVM tests
        if: steps.tag.outputs.publish == 'true'
        run: node scripts/build.cjs --test

      - name: Build the signed APK
        if: steps.tag.outputs.publish == 'true'
        # The secrets live only in this step's env and are never echoed; the keystore is decoded
        # under RUNNER_TEMP, outside the checkout, and removed after the build.
        env:
          KEYSTORE_BASE64: ${{ secrets.INKTOOLS_LINGO_KEYSTORE_BASE64 }}
          INKTOOLS_LINGO_KEYSTORE_PASSWORD: ${{ secrets.INKTOOLS_LINGO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::INKTOOLS_LINGO_KEYSTORE_BASE64 is not set, so no release is published: an APK signed by another key could never be updated on the tablet (#494)."
            exit 1
          fi
          store="$RUNNER_TEMP/handwriting-language.keystore"
          trap 'rm -f "$store"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$store"
          unset KEYSTORE_BASE64
          INKTOOLS_LINGO_KEYSTORE="$store" node scripts/build.cjs

      - name: Create the prerelease
        if: steps.tag.outputs.publish == 'true'
        run: |
          asset="build/outputs/lingo-app-${TAG#handwriting-language-v}.apk"
          gh release create "$TAG" "$asset" \
            --prerelease --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Handwriting Language test build (#494). On the tablet: turn on Settings › Security & Privacy › Sideloading, download $(basename "$asset") in the Browser, open it and tap Install, then open Handwriting Language from the sidebar and use its buttons to allow each permission."

      - name: Read the asset back
        if: steps.tag.outputs.publish == 'true'
        run: |
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$names"
          case "$names" in
            *"lingo-app-${TAG#handwriting-language-v}.apk"*) ;;
            *) echo "::error::lingo-app-${TAG#handwriting-language-v}.apk is missing from $TAG."; exit 1 ;;
          esac
