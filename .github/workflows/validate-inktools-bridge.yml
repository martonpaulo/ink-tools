name: Validate Ink Tools bridge

# Runs only when apps/inktools-bridge/ (or this file, the Lingo app's toolchain it reuses, or the shared version rule) changes; the gate is the
# subproject's own JVM tests and APK build (#215).
on:
  push:
    branches: [main]
    paths: ['apps/inktools-bridge/**', 'apps/handwriting-language/scripts/**', 'scripts/plugin-version.cjs', 'registry/**', '.github/workflows/validate-inktools-bridge.yml']
  pull_request:
    paths: ['apps/inktools-bridge/**', 'apps/handwriting-language/scripts/**', 'scripts/plugin-version.cjs', 'registry/**', '.github/workflows/validate-inktools-bridge.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate inktools-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/inktools-bridge
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the subproject's Markdown (text check and issue links, #77)
        working-directory: .
        run: |
          python3 scripts/text_check.py apps/inktools-bridge
          python3 scripts/issue_links.py apps/inktools-bridge --repo "$GITHUB_REPOSITORY"

      - name: Run the JVM tests
        run: node scripts/build.cjs --test

      - name: Build the signed APK
        # toolchain.sh reuses the runner's SDK; the debug key is made fresh for this run.
        run: node scripts/build.cjs
