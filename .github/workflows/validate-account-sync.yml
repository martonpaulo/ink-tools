name: Validate Account Sync

# Runs only when plugins/account-sync/, the other plugins whose views packages/ui-kit/renders/screens.tsx draws and typechecks here (#249), the shared packages/ui-kit/, ink-core and sync-core it imports (#93, #301), the picture-search and sn-adapter Java it compiles, plugin-version.cjs, or this file changes; the gate is the subproject's own `npm run validate`, then the Android build cloud sessions cannot run (#235).
on:
  push:
    branches: [main]
    paths: ['plugins/account-sync/**', 'plugins/image-editing/**', 'plugins/lasso-actions/**', 'plugins/device-link/**', 'plugins/smart-pen/**', 'plugins/puzzles/**', 'plugins/ink-tools-probe/**', 'packages/native-build/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/picture-search/**', 'scripts/plugin-version.cjs', 'docs/feature-defaults.md', 'packages/sync-core/**', 'packages/ink-core/**', '.github/workflows/validate-account-sync.yml']
  pull_request:
    paths: ['plugins/account-sync/**', 'plugins/image-editing/**', 'plugins/lasso-actions/**', 'plugins/device-link/**', 'plugins/smart-pen/**', 'plugins/puzzles/**', 'plugins/ink-tools-probe/**', 'packages/native-build/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/picture-search/**', 'scripts/plugin-version.cjs', 'docs/feature-defaults.md', 'packages/sync-core/**', 'packages/ink-core/**', '.github/workflows/validate-account-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate account-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/account-sync
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/account-sync/package-lock.json

      - name: Restore node_modules, keyed on the lockfile (#301)
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            plugins/account-sync/node_modules
          key: node-modules-${{ runner.os }}-node24-plugins/account-sync-${{ hashFiles('plugins/account-sync/package-lock.json') }}

      - name: Restore the native toolchain, keyed on its script (#301)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/account-sync/.toolchain
          key: toolchain-${{ runner.os }}-plugins/account-sync-${{ hashFiles('packages/native-build/native-toolchain.sh') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run the gate
        run: npm run validate

      - name: Build the native-capable plugin package
        # The JS package, then Bridge's Java module against the Android SDK (#235);
        # native-toolchain.sh reuses the runner's SDK.
        run: npm run build

      - name: Check the package holds the native module
        run: unzip -l build/outputs/Bridge.snplg | grep -q app.npk
