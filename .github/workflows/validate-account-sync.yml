name: Validate Account Sync

# Runs only when plugins/account-sync/, the shared packages/ui-kit/ it imports (#93), the picture-search and sn-adapter Java it compiles, or this file changes; the gate is the subproject's own `npm run validate`, then the Android build cloud sessions cannot run (#235).
on:
  push:
    branches: [main]
    paths: ['plugins/account-sync/**', 'packages/native-build/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/picture-search/**', '.github/workflows/validate-account-sync.yml']
  pull_request:
    paths: ['plugins/account-sync/**', 'packages/native-build/**', 'packages/ui-kit/**', 'packages/sn-adapter/**', 'packages/picture-search/**', '.github/workflows/validate-account-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate account-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/account-sync
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/account-sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the subproject's Markdown (text check and issue links, #77)
        working-directory: .
        run: |
          python3 scripts/text_check.py plugins/account-sync
          python3 scripts/issue_links.py plugins/account-sync --repo "$GITHUB_REPOSITORY"

      - name: Run the gate
        run: npm run validate

      - name: Build the native-capable plugin package
        # The JS package, then Bridge's Java module against the Android SDK (#235);
        # native-toolchain.sh reuses the runner's SDK.
        run: npm run build

      - name: Check the package holds the native module
        run: unzip -l build/outputs/Bridge.snplg | grep -q app.npk
