# Fleet Dependabot configuration, from project-setup's dependabot.template.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /plugins/account-sync
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
      timezone: UTC
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 3
      semver-patch-days: 3
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # PluginHost on the device fixes these versions; the plugin must match them exactly.
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: react-test-renderer
      - dependency-name: sn-plugin-lib
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

