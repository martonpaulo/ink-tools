<!doctype html>
<!--
  Ink Tools social card, 1200x630 (#462, first card #371; Workbench public-pages.md section 5).
  Render: bash scripts/social-card.sh, which writes design/social-card/social-card.jpg and its copy
  site/social-card.jpg, the og:image and twitter:image of every page.
  Model: the retired picture plugin's card (its archived repository, design/social-card/): warm paper, a pill,
  the name, a two-line benefit, the icon and address; on the right a plain dark bezel (no brand
  marks) cropped at the bottom edge.
  Colours: the tokens in :root, the e-ink palette (near-black ink on warm paper with greys, no
  other colour and no gradient).
  The visual: a handwritten «soup» in a lasso, the Lasso Actions buttons under it, and the picture
  Insert Sticker put in. tureen.svg: Openclipart 185227 «tureen» by johnny_automatic, CC0, from
  Dorothy Daly's «Italian Cooking» (not in copyright); unchanged. See NOTICE.md.
  The icon is design/icon.svg as an image, since a file:// page loads an SVG only as an image.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink Tools social card</title>
<style>
  @font-face { font-family: "Gabarito"; src: url("../fonts/Gabarito[wght].ttf"); font-weight: 400 900; }
  @font-face { font-family: "Figtree"; src: url("../fonts/Figtree[wght].ttf"); font-weight: 300 900; }
  @font-face { font-family: "Caveat"; font-weight: 600; src: url("fonts/caveat-latin-600-normal.woff2") format("woff2"); }
  :root {
    --ink: #1c1c1a;
    --ink-soft: #4a4945;
    --paper: #ece8df;
    --screen: #f8f6f1;
    --rule: #dcd8cf;
    --bezel: #262624;
    --shadow-far: rgba(28, 28, 26, .22);
    --shadow-near: rgba(28, 28, 26, .14);
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: "Figtree", sans-serif; color: var(--ink); background: var(--paper); }
  .copy {
    position: absolute; left: 96px; top: 0; bottom: 0; width: 480px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow {
    align-self: flex-start;
    font-size: 19px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    padding: 9px 16px; border-radius: 999px; border: 2px solid var(--ink);
  }
  h1 { font-family: "Gabarito", sans-serif; font-weight: 700; font-size: 88px; line-height: 1; margin: 28px 0 20px; letter-spacing: -.01em; }
  .promise { font-size: 38px; font-weight: 500; line-height: 1.2; margin: 0; }
  .domain { display: flex; align-items: center; gap: 14px; margin-top: 36px; font-size: 24px; font-weight: 500; color: var(--ink-soft); }
  .domain img { width: 40px; height: 40px; flex: none; }
  .device {
    position: absolute; left: 660px; top: 52px; width: 452px; height: 640px;
    box-sizing: border-box; padding: 20px 20px 0;
    background: var(--bezel); border-radius: 30px 30px 0 0;
    box-shadow: 0 30px 60px var(--shadow-far), 0 6px 16px var(--shadow-near);
  }
  .screen {
    position: relative; height: 100%; overflow: hidden;
    background-color: var(--screen);
    background-image: repeating-linear-gradient(to bottom, transparent 0 47px, var(--rule) 47px 48px);
    background-position: 0 30px;
    border-radius: 10px 10px 0 0;
  }
  .word {
    position: absolute; left: 0; right: 0; top: 30px; text-align: center;
    font-family: "Caveat", cursive; font-weight: 600; font-size: 104px; line-height: 1;
    transform: rotate(-3deg);
  }
  .lasso { position: absolute; left: 88px; top: 26px; width: 236px; height: 124px; stroke: var(--ink-soft); }
  .toolbar {
    position: absolute; left: 50%; top: 164px; transform: translateX(-50%); display: flex;
    background: var(--screen); border: 2px solid var(--ink); border-radius: 10px; overflow: hidden;
    font-size: 18px; font-weight: 600; white-space: nowrap;
  }
  .toolbar span { padding: 11px 14px; border-right: 2px solid var(--ink); }
  .toolbar span:first-child { background: var(--ink); color: var(--screen); }
  .toolbar span:last-child { border-right: 0; }
  .picture { position: absolute; left: 76px; top: 240px; width: 248px; padding: 6px; background: var(--screen); }
</style>
</head>
<body>
  <div class="copy">
    <span class="eyebrow">Supernote tools · Open source</span>
    <h1>Ink Tools</h1>
    <p class="promise">Plugins and Mac tools<br>for your Supernote.</p>
    <div class="domain">
      <img src="../icon.svg" alt="">
      inktools.martonpaulo.com
    </div>
  </div>
  <div class="device" aria-hidden="true">
    <div class="screen">
      <div class="word">soup</div>
      <svg class="lasso" viewBox="0 0 236 124" fill="none" stroke-width="2.5" stroke-dasharray="9 7" stroke-linecap="round">
        <path d="M30 22C70 4 170 2 212 20c24 12 22 62 2 82-34 22-150 22-190 2C2 90 0 40 30 22z"/>
      </svg>
      <div class="toolbar"><span>Insert Sticker</span><span>Translate</span><span>Definition</span></div>
      <img class="picture" src="tureen.svg" alt="">
    </div>
  </div>
</body>
</html>
