<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <!-- Cover template, pilot B «Stacked steps». Black, white and greys only. render.mjs fills the double-brace fields. -->
  <defs>
    <pattern id="hatch" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="48" height="48" fill="#FFFFFF"/>
      <rect width="18" height="48" fill="#000000"/>
    </pattern>
  </defs>
  <rect width="1200" height="1600" fill="#FFFFFF"/>

  <!-- Title band: icon centred over the name -->
  <rect width="1200" height="420" fill="#000000"/>
  <circle cx="600" cy="128" r="88" fill="#FFFFFF"/>
  <g transform="translate(532 60) scale(0.265625)">{{icon}}</g>
  <text x="600" y="330" text-anchor="middle" font-family="Gabarito" font-weight="900" font-size="132" letter-spacing="10" fill="#FFFFFF">{{NAME}}</text>
  <text x="600" y="392" text-anchor="middle" font-family="Figtree" font-weight="700" font-size="44" fill="#CCCCCC">{{tagline}}</text>

  <!-- How it works: two full-width steps -->
  <g transform="translate(64 468)">
    <rect width="1072" height="300" rx="24" fill="#E6E6E6"/>
    <path d="M24 0 H150 V300 H24 A24 24 0 0 1 0 276 V24 A24 24 0 0 1 24 0 Z" fill="#000000"/>
    <text x="75" y="190" text-anchor="middle" font-family="Gabarito" font-weight="900" font-size="120" fill="#FFFFFF">1</text>
    <g transform="translate(180 17) scale(0.83333)">{{panels.0.art}}</g>
    <text font-family="Figtree" font-weight="800" font-size="46" fill="#000000">{{lines:panels.0.caption:600:132:56}}</text>
  </g>
  <g transform="translate(64 796)">
    <rect width="1072" height="300" rx="24" fill="#E6E6E6"/>
    <path d="M24 0 H150 V300 H24 A24 24 0 0 1 0 276 V24 A24 24 0 0 1 24 0 Z" fill="#000000"/>
    <text x="75" y="190" text-anchor="middle" font-family="Gabarito" font-weight="900" font-size="120" fill="#FFFFFF">2</text>
    <g transform="translate(180 17) scale(0.83333)">{{panels.1.art}}</g>
    <text font-family="Figtree" font-weight="800" font-size="46" fill="#000000">{{lines:panels.1.caption:600:132:56}}</text>
  </g>

  <!-- Features: up to four, two columns, white icons on black discs -->
  <!--slot:features.0--><g transform="translate(64 1144)">
    <circle cx="52" cy="52" r="52" fill="#000000"/>
    <g transform="translate(20 20)" color="#FFFFFF">{{icon:features.0.icon}}</g>
    <text font-family="Figtree" font-weight="700" font-size="40" fill="#000000">{{lines:features.0.label:128:42:48}}</text>
  </g><!--/slot-->
  <!--slot:features.1--><g transform="translate(616 1144)">
    <circle cx="52" cy="52" r="52" fill="#000000"/>
    <g transform="translate(20 20)" color="#FFFFFF">{{icon:features.1.icon}}</g>
    <text font-family="Figtree" font-weight="700" font-size="40" fill="#000000">{{lines:features.1.label:128:42:48}}</text>
  </g><!--/slot-->
  <!--slot:features.2--><g transform="translate(64 1296)">
    <circle cx="52" cy="52" r="52" fill="#000000"/>
    <g transform="translate(20 20)" color="#FFFFFF">{{icon:features.2.icon}}</g>
    <text font-family="Figtree" font-weight="700" font-size="40" fill="#000000">{{lines:features.2.label:128:42:48}}</text>
  </g><!--/slot-->
  <!--slot:features.3--><g transform="translate(616 1296)">
    <circle cx="52" cy="52" r="52" fill="#000000"/>
    <g transform="translate(20 20)" color="#FFFFFF">{{icon:features.3.icon}}</g>
    <text font-family="Figtree" font-weight="700" font-size="40" fill="#000000">{{lines:features.3.label:128:42:48}}</text>
  </g><!--/slot-->

  <!-- Hatched footer stripe -->
  <rect y="1490" width="1200" height="110" fill="url(#hatch)"/>
</svg>
