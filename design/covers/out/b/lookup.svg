<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <!-- Cover template, pilot B «Stacked steps». Black, white and greys only. render.mjs fills the double-brace fields. -->
  <defs>
    <pattern id="hatch" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="48" height="48" fill="#FFFFFF"/>
      <rect width="18" height="48" fill="#000000"/>
    </pattern>
  </defs>
  <rect width="1200" height="1600" fill="#FFFFFF"/>

  <!-- Title band: icon centred over the name -->
  <rect width="1200" height="420" fill="#000000"/>
  <circle cx="600" cy="128" r="88" fill="#FFFFFF"/>
  <g transform="translate(532 60) scale(0.265625)"><!-- lookup, placeholder icon (512x512, drawn in black): a magnifier over a word line. Replaced by the plugin's own icon when it lands. -->
<circle cx="220" cy="220" r="128" fill="none" stroke="#000000" stroke-width="52"/>
<path d="M314 314 L430 430" stroke="#000000" stroke-width="64" stroke-linecap="round"/>
<path d="M160 228 C178 196 196 196 210 226 C224 254 244 254 270 214" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round"/></g>
  <text x="600" y="330" text-anchor="middle" font-family="Gabarito" font-weight="900" font-size="132" letter-spacing="10" fill="#FFFFFF">LOOKUP</text>
  <text x="600" y="392" text-anchor="middle" font-family="Figtree" font-weight="700" font-size="44" fill="#CCCCCC">Lasso a word, get a picture or text</text>

  <!-- How it works: two full-width steps -->
  <g transform="translate(64 468)">
    <rect width="1072" height="300" rx="24" fill="#E6E6E6"/>
    <path d="M24 0 H150 V300 H24 A24 24 0 0 1 0 276 V24 A24 24 0 0 1 24 0 Z" fill="#000000"/>
    <text x="75" y="190" text-anchor="middle" font-family="Gabarito" font-weight="900" font-size="120" fill="#FFFFFF">1</text>
    <g transform="translate(180 17) scale(0.83333)"><!-- lookup, panel 1 (480x320): a handwritten word on a ruled page, closed in a lasso. -->
<rect x="20" y="16" width="440" height="288" rx="16" fill="#FFFFFF" stroke="#888888" stroke-width="5"/>
<path d="M56 96 H424 M56 160 H424 M56 224 H424 M56 288 H424" stroke="#CCCCCC" stroke-width="4"/>
<path d="M96 196 C104 150 134 146 132 176 C130 204 112 214 118 188 C126 160 156 158 158 184 C160 206 182 206 186 180 C190 154 214 152 214 180 C214 206 238 204 242 172 C246 132 262 116 270 136 C278 156 254 214 262 200 C272 176 292 168 300 186 C308 204 326 202 334 180 C342 160 364 164 360 188 C356 210 384 206 396 186" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="246" cy="178" rx="196" ry="86" fill="none" stroke="#000000" stroke-width="6" stroke-dasharray="20 14"/></g>
    <text font-family="Figtree" font-weight="800" font-size="46" fill="#000000"><tspan x="600" y="132">Write a word,</tspan><tspan x="600" dy="56">then lasso it</tspan></text>
  </g>
  <g transform="translate(64 796)">
    <rect width="1072" height="300" rx="24" fill="#E6E6E6"/>
    <path d="M24 0 H150 V300 H24 A24 24 0 0 1 0 276 V24 A24 24 0 0 1 24 0 Z" fill="#000000"/>
    <text x="75" y="190" text-anchor="middle" font-family="Gabarito" font-weight="900" font-size="120" fill="#FFFFFF">2</text>
    <g transform="translate(180 17) scale(0.83333)"><!-- lookup, panel 2 (480x320): the three lasso buttons, Sticker pressed, and the inserted sticker. -->
<rect x="8" y="8" width="464" height="84" rx="20" fill="#000000"/>
<rect x="22" y="20" width="148" height="60" rx="12" fill="#FFFFFF"/>
<text x="96" y="61" text-anchor="middle" font-family="Figtree" font-weight="800" font-size="30" fill="#000000">Sticker</text>
<rect x="182" y="20" width="132" height="60" rx="12" fill="none" stroke="#FFFFFF" stroke-width="4"/>
<text x="248" y="61" text-anchor="middle" font-family="Figtree" font-weight="800" font-size="30" fill="#FFFFFF">Image</text>
<rect x="326" y="20" width="132" height="60" rx="12" fill="none" stroke="#FFFFFF" stroke-width="4"/>
<text x="392" y="61" text-anchor="middle" font-family="Figtree" font-weight="800" font-size="30" fill="#FFFFFF">Text</text>
<rect x="150" y="116" width="180" height="196" fill="none" stroke="#888888" stroke-width="4" stroke-dasharray="12 10"/>
<path d="M186 176 H284 V244 C284 274 262 292 236 292 C208 292 186 274 186 244 Z" fill="#E6E6E6" stroke="#000000" stroke-width="9" stroke-linejoin="round"/>
<path d="M284 196 C318 196 318 240 284 240" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
<path d="M212 158 C204 146 220 138 212 126 M240 158 C232 146 248 138 240 126 M262 158 C254 146 270 138 262 126" fill="none" stroke="#444444" stroke-width="7" stroke-linecap="round"/>
<g fill="#000000"><rect x="140" y="106" width="20" height="20"/><rect x="320" y="106" width="20" height="20"/><rect x="140" y="302" width="20" height="20"/><rect x="320" y="302" width="20" height="20"/></g></g>
    <text font-family="Figtree" font-weight="800" font-size="46" fill="#000000"><tspan x="600" y="132">Tap Sticker,</tspan><tspan x="600" dy="56">Image or Text</tspan></text>
  </g>

  <!-- Features: up to four, two columns, white icons on black discs -->
  <g transform="translate(64 1144)">
    <circle cx="52" cy="52" r="52" fill="#000000"/>
    <g transform="translate(20 20)" color="#FFFFFF"><!-- feature icon (64x64): a smiling face. -->
<circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="6"/>
<circle cx="24" cy="27" r="4" fill="currentColor"/><circle cx="40" cy="27" r="4" fill="currentColor"/>
<path d="M21 38 C26 46 38 46 43 38" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></g>
    <text font-family="Figtree" font-weight="700" font-size="40" fill="#000000"><tspan x="128" y="42">Line-art stickers</tspan><tspan x="128" dy="48">and OpenMoji</tspan></text>
  </g>
  <g transform="translate(616 1144)">
    <circle cx="52" cy="52" r="52" fill="#000000"/>
    <g transform="translate(20 20)" color="#FFFFFF"><!-- feature icon (64x64): a photo with a mountain and the sun. -->
<rect x="8" y="12" width="48" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="6"/>
<path d="M12 48 L28 30 L38 40 L44 34 L54 46" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
<circle cx="43" cy="23" r="5" fill="currentColor"/></g>
    <text font-family="Figtree" font-weight="700" font-size="40" fill="#000000"><tspan x="128" y="42">Real photos of</tspan><tspan x="128" dy="48">people and places</tspan></text>
  </g>
  <g transform="translate(64 1296)">
    <circle cx="52" cy="52" r="52" fill="#000000"/>
    <g transform="translate(20 20)" color="#FFFFFF"><!-- feature icon (64x64): lines of text. -->
<path d="M10 16 H54 M10 28 H54 M10 40 H54 M10 52 H38" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></g>
    <text font-family="Figtree" font-weight="700" font-size="40" fill="#000000"><tspan x="128" y="42">Short definitions</tspan><tspan x="128" dy="48">and bios</tspan></text>
  </g>
  <g transform="translate(616 1296)">
    <circle cx="52" cy="52" r="52" fill="#000000"/>
    <g transform="translate(20 20)" color="#FFFFFF"><!-- feature icon (64x64): an open padlock, for open sources with no account. -->
<rect x="12" y="28" width="40" height="28" rx="5" fill="currentColor"/>
<path d="M22 28 V18 C22 6 42 6 42 18" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></g>
    <text font-family="Figtree" font-weight="700" font-size="40" fill="#000000"><tspan x="128" y="42">Open sources,</tspan><tspan x="128" dy="48">no account</tspan></text>
  </g>

  <!-- Hatched footer stripe -->
  <rect y="1490" width="1200" height="110" fill="url(#hatch)"/>
</svg>
